<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: an archive ledger. The sidebar holds the knowledge strata (Common at the top, Lost at the bottom); the working pane is on the right. */
  --paper:#eceee9; --sheet:#f8f9f6; --ink:#1d2433; --muted:#5b6474; --rule:#d2d6ce; --accent:#24466e; --accent-ink:#ffffff; --field:#ffffff;
  --c:#a8956a; --d:#bf7a22; --e:#2a8073; --h:#4b50a6; --l:#7d2637;
  --ok:#2c7a4c; --warn:#a1650f; --bad:#b3263a;
  --f-display:"Spectral SC","Iowan Old Style",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161d; --sheet:#1a2029; --ink:#e3e6ec; --muted:#9aa3b2; --rule:#2d3541; --accent:#8fb3e0; --accent-ink:#0e1520; --field:#141922;
    --c:#c9b689; --d:#e09a42; --e:#4fb3a6; --h:#8f94f2; --l:#d6566d;
    --ok:#5cc18a; --warn:#e0a548; --bad:#ef6b7f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12161d; --sheet:#1a2029; --ink:#e3e6ec; --muted:#9aa3b2; --rule:#2d3541; --accent:#8fb3e0; --accent-ink:#0e1520; --field:#141922;
  --c:#c9b689; --d:#e09a42; --e:#4fb3a6; --h:#8f94f2; --l:#d6566d;
  --ok:#5cc18a; --warn:#e0a548; --bad:#ef6b7f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-body)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:18px;padding:18px 14px;overflow:auto}
.brand-title{font:600 22px/1.05 var(--f-display);letter-spacing:.01em}
.brand-sub{color:var(--muted);font-size:12px;margin-top:4px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
nav button:hover{background:var(--sheet)}
nav button[aria-current="page"]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font:12px var(--f-mono);color:var(--muted)}
.lbl,.fld>label{font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.strata{display:flex;flex-direction:column;gap:3px}
.band{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;border-left:4px solid var(--dc);background:color-mix(in srgb,var(--dc) 13%,transparent);font-size:12.5px}
.band b{font:600 12px var(--f-mono);color:var(--dc)}
.store{font-size:12px;color:var(--muted);margin-top:auto}
.store .warn{color:var(--warn)}
main{overflow:auto;padding:18px 22px 40px;min-width:0}
h1{font:600 26px/1.1 var(--f-display);margin:0 0 4px;text-wrap:balance}
h2{font:600 18px/1.2 var(--f-display);margin:18px 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 14px;max-width:72ch}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px;min-width:0}
.split{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(340px,1.25fr);gap:16px;align-items:start}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar .grow{flex:1 1 180px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
select{width:auto;max-width:100%}
.toolbar input,.toolbar select{width:auto}
textarea{font-family:var(--f-mono);font-size:12.5px;line-height:1.5;resize:vertical}
#e-text,#e-gm,#n-notes{font-family:var(--f-body);font-size:14px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type="checkbox"]{width:auto}
.btn{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 12px;font:500 13px var(--f-body);white-space:nowrap}
.btn.q{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn.small{padding:3px 9px;font-size:12px}
.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.rows{display:flex;flex-direction:column;max-height:calc(100vh - 230px);overflow:auto;min-height:120px}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 6px;border:0;border-bottom:1px solid var(--rule);cursor:pointer;text-align:left;background:none;color:inherit;font:inherit;width:100%}
.row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.row[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.row .t{font-weight:500;overflow-wrap:anywhere}
.id{font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.dz{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;font:600 12px var(--f-mono);color:#fff;background:var(--dc);flex:none}
.dz-C{--dc:var(--c)} .dz-D{--dc:var(--d)} .dz-E{--dc:var(--e)} .dz-H{--dc:var(--h)} .dz-L{--dc:var(--l)}
.tag{display:inline-block;font-size:11.5px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:0 7px;margin:2px 4px 0 0;white-space:nowrap}
.tag.status-decided{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.tag.status-proposal{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{cursor:pointer;border:1px solid var(--rule);background:var(--field);color:var(--ink);border-radius:999px;padding:2px 9px;font:12px var(--f-body)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.d.on{background:var(--dc);border-color:var(--dc);color:#fff}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.hint{font-size:12px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.stat{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--sheet)}
.stat b{font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.tell{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.trust{background:color-mix(in srgb,var(--h) 16%,transparent);color:var(--h)}
.pill.req{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.refused{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.known{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.res{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 4px;border-bottom:1px solid var(--rule)}
.res .why{font-size:12.5px;color:var(--muted);margin-top:2px}
.res .txt{margin-top:3px;max-width:75ch}
.group-h{display:flex;align-items:center;gap:8px;font:600 16px var(--f-display);margin:16px 0 4px}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule)}
.sev{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:2px 6px}
.sev.error{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.sev.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.fblock{border:1px dashed var(--rule);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fblock-h{display:flex;gap:8px;align-items:center}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .node{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--rule);border-radius:6px;padding:2px 8px 2px 2px;background:var(--field);cursor:pointer;color:inherit;font:inherit}
.chain .node.self{border-color:var(--accent)}
.chain .arrow{color:var(--muted)}
.link{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.banner{border:1px solid var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);padding:6px 10px;border-radius:6px;font-size:12.5px;margin-bottom:12px}
.empty{color:var(--muted);padding:22px 6px}
details{border-top:1px solid var(--rule);padding-top:10px;margin-top:12px}
details summary{cursor:pointer;font-weight:600}
.guide p,.guide li{max-width:70ch}
.guide code,.mono{font:12.5px var(--f-mono)}
.card{border:1px solid var(--rule);border-radius:8px;padding:10px;display:grid;grid-template-columns:auto 24px minmax(0,1fr);gap:10px;align-items:start;background:var(--field)}
.card + .card{margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:grid;place-items:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.modal-card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;max-width:880px;width:100%;max-height:92%;overflow:auto;padding:16px}
#toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:420px;z-index:20}
#toast.show{opacity:1}
.depthkey{display:grid;grid-template-columns:24px 110px minmax(0,1fr);gap:6px 10px;align-items:start;font-size:13px}
@media (max-width: 980px){
  .app{grid-template-columns:1fr;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .split,.twocol{grid-template-columns:1fr}
  .rows{max-height:none}
}
@media (max-width: 560px){ .form{grid-template-columns:1fr} main{padding:14px} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div>
      <div class="brand-title">Knowledge Workbench</div>
      <div class="brand-sub">RunicGame lore · server-only knowledge</div>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div>
      <div class="lbl" style="margin-bottom:6px">Strata</div>
      <div class="strata" id="strata"></div>
    </div>
    <div class="store" id="store-status">Connecting to saved knowledge…</div>
  </aside>
  <main id="main"></main>
</div>
<div class="modal" id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="dl-entries"></datalist>
<datalist id="dl-scopes"></datalist>
<datalist id="dl-npcs"></datalist>
<datalist id="dl-langs"></datalist>

<script>
"use strict";
/* ---------- Schema ---------- */
const DEPTHS = ["C","D","E","H","L"];
const DORD = {C:0,D:1,E:2,H:3,L:4};
const DEPTH_INFO = {
  C:{name:"Common", who:"Anyone in its scope.", how:"Spreads by talk. Anyone tells it, to anyone."},
  D:{name:"Doctrine", who:"Members of a faith, faction or group.", how:"What the group believes and tells openly. It carries the group's perspective and can be partial or wrong."},
  E:{name:"Expertise", who:"Specialists, by role and skill.", how:"What experts know to be true by study or craft. Usually needs groundwork from the player first."},
  H:{name:"Hidden", who:"A handful of NPCs, or specific places.", how:"Kept on purpose. The teller has to trust the player."},
  L:{name:"Lost", who:"Nobody alive.", how:"Only from ruins, inscriptions, objects, Echoes or the gods."}
};
const DEFAULT_TAX = {
  types:["person","deity","people","organization","faction","place","creature","object","event","era","principle","practice","custom","text"],
  domains:["cosmos","runes-and-magic","gods-and-faith","history","peoples","factions-and-politics","organizations","places","the-anchored","threats","crafts-and-trade","nature-and-creatures","law-and-customs","technology"],
  spheres:["mundane","arcane","divine","cosmic","void"],
  concepts:["existence","space","time","chaos","life","death","sea","sky","stone","fire","flora","fauna","history","trade","hearth","art","invention","war","void"],
  reliability:["true","partial","belief","rumor","lie"],
  perspectives:["neutral","faction-1","faction-2","pirates","altar-keepers"],
  factions:["faction-1","faction-2","pirates","neutral"],
  languages:["faction-1-tongue","faction-2-tongue","wake-cant","runic"],
  sources:["dialogue","overhear","book","inscription","item","discovery","observation","quest","event"],
  statuses:["decided","proposal","draft"],
  refusals:["outlaw","infamy","enemy-faction","pirate"],
  tiers:{npc:["Stranger","Acquaintance","Trusted","Confidant"], org:["Neutral","Friendly","Honored","Revered","Exalted"], region:["Outsider","Known","Respected","Local hero"]},
  sectionMap:{C:["common","rumor","rumors","everyone knows"], D:["doctrine","taught","teaching","teachings","faith","what they believe"], E:["expertise","scholarly","scholar","specialist","experts know"], H:["hidden","secret","secrets"], L:["lost","forgotten"]}
};
const LIST_FIELDS = ["domains","spheres","concepts","requires","requires_any","conditions","gate","next","related","contradicts","about","unlocks","sources"];
const ENTRY_ORDER = ["id","title","text","gm","type","subtype","domains","spheres","concepts","depth","reliability","perspective","scope","era","status","requires","requires_any","conditions","gate","next","related","contradicts","about","unlocks","sources"];
const TABS = [["library","Library"],["npcs","NPCs"],["simulate","Simulate"],["notes","Notes to entries"],["check","Check"],["taxonomy","Taxonomy"]];

const EXAMPLE_NOTE = `---
about: [altars]
scope: world
domains: [the-anchored]
spheres: [divine, arcane]
concepts: [life, time, space]
type: principle
chain: true
---
# Altars (example note)

GM notes: every city has one. Use the circle as a safe stop between hard areas.
Nothing outside a knowledge callout ever reaches a player.

## Common
> [!knowledge] Resting at an Altar
> Travellers rest at Altars between journeys, and the Anchored travel from one Altar to another.

## Doctrine
> [!knowledge] Holy ground
> perspective:: altar-keepers
> reliability:: partial
> The Altar Keepers teach that an Altar's circle belongs to every god at once, so no blood may be spilled there.

## Expertise
> [!knowledge] Runes in the stone
> The stone of an Altar is a rune derived from the World Runes. Nobody alive can carve a new one.

## Secrets
> [!knowledge] Older than the Keepers
> gate:: npc>=Confidant
> The Keepers did not build the Altars. Their oldest record only says the Altars were already there.
`;

const clone = x => JSON.parse(JSON.stringify(x));
const S = {
  tax: clone(DEFAULT_TAX), entries:new Map(), npcs:new Map(), players:new Map(),
  mode:"loading", note:"", sample:null, sampleChecked:false,
  ui:{ tab:"library", selEntry:null, entryDraft:null, selNpc:null, npcDraft:null, simNpc:"", simPlayer:"", simTopic:"", playerDraft:null,
       f:{q:"",depth:[],domain:"",concept:"",sphere:"",type:"",status:""},
       noteText:EXAMPLE_NOTE, extracted:[], extractedNpc:"", marked:"", aiBusy:false, delArm:null, aiError:"" }
};

/* ---------- Utilities ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function slug(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9._:]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80); }
function list(s){ if(Array.isArray(s)) return s.map(x=>String(x).trim()).filter(Boolean); return String(s||"").split(/[,\n]/).map(x=>x.trim()).filter(Boolean); }
function lines(s){ return String(s||"").split("\n").map(x=>x.trim()).filter(Boolean); }
function uniq(a){ return [...new Set(a)]; }
function overlap(a,b){ return (a||[]).some(x=>(b||[]).includes(x)); }
function normScope(s){ let v=String(s||"world").trim().toLowerCase().replace(/\s+/g,"-").replace(/^\/+|\/+$/g,""); if(!v) return "world"; if(v!=="world" && !v.startsWith("world/")) v="world/"+v; return v; }
function scopeRelated(a,b){ a=normScope(a); b=normScope(b); return a===b || a.startsWith(b+"/") || b.startsWith(a+"/"); }
function byDepthTitle(a,b){ return (DORD[a.depth]??9)-(DORD[b.depth]??9) || String(a.title||a.id).localeCompare(String(b.title||b.id)); }
function dz(d){ return `<span class="dz dz-${esc(d||"C")}" title="${esc((DEPTH_INFO[d]||{}).name||"")}">${esc(d||"?")}</span>`; }
function titleOf(id){ const e=S.entries.get(id); return e ? (e.title||id) : id; }
function npcName(id){ const n=S.npcs.get(id); return n ? (n.name||id) : id; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),3200); }
function tierList(kind){ return (S.tax.tiers||{})[kind] || []; }
function tierVal(kind,v){ const s=String(v??"").trim(); if(/^-?\d+$/.test(s)) return Number(s); const i=tierList(kind).findIndex(t=>t.toLowerCase()===s.toLowerCase()); return i; }
function tierName(kind,n){ const t=tierList(kind)[n]; return t ?? String(n); }
function cleanEntry(e){
  const o={};
  for(const k of ENTRY_ORDER){
    let v=e[k];
    if(LIST_FIELDS.includes(k)) v=uniq(list(v||[]));
    else if(typeof v==="string") v=v.trim();
    if(v===undefined || v===null) v = LIST_FIELDS.includes(k)?[]:"";
    o[k]=v;
  }
  o.depth = DEPTHS.includes(o.depth)?o.depth:"C";
  o.scope = normScope(o.scope);
  o.perspective = o.perspective || "neutral";
  o.reliability = o.reliability || "true";
  o.status = o.status || "draft";
  o.id = slug(o.id || o.title);
  return o;
}

/* ---------- Conditions (a small text language) ----------
   npc>=Trusted · level>=20 · org:tide-temple>=Friendly · region:world/continent-1>=Known · prof:language>=20
   lang:runic · quest:found-the-bell · item:old-key · faction:faction-1 · race:elf */
function parseCond(raw){
  const s=String(raw||"").trim(); let m;
  if((m=s.match(/^(npc|level)\s*>=\s*(.+)$/i))) return {kind:m[1].toLowerCase(), min:m[2].trim(), raw:s};
  if((m=s.match(/^(org|region|prof)\s*:\s*([^\s>]+)\s*>=\s*(.+)$/i))) return {kind:m[1].toLowerCase(), key:m[2].trim(), min:m[3].trim(), raw:s};
  if((m=s.match(/^(lang|quest|item|faction|race)\s*:\s*(.+)$/i))) return {kind:m[1].toLowerCase(), key:m[2].trim(), raw:s};
  return {error:true, raw:s};
}
function condMet(c,p,npc){
  if(c.error) return false;
  switch(c.kind){
    case "npc": { const have=Number((p.npc_trust||{})[npc?.id] ?? 0); const need=tierVal("npc",c.min); return need>=0 && have>=need; }
    case "level": return Number(p.level||0) >= Number(c.min);
    case "org": { const have=Number((p.orgs||{})[c.key] ?? 0); const need=tierVal("org",c.min); return need>=0 && have>=need; }
    case "region": { const need=tierVal("region",c.min); if(need<0) return false; const key=normScope(c.key); let best=-1; for(const [path,v] of Object.entries(p.regions||{})){ const pth=normScope(path); if(key===pth || key.startsWith(pth+"/")) best=Math.max(best,Number(v)); } return best>=need; }
    case "prof": return Number((p.professions||{})[c.key] ?? 0) >= Number(c.min);
    case "lang": return (p.languages||[]).includes(c.key);
    case "quest": return (p.quests||[]).includes(c.key);
    case "item": return (p.items||[]).includes(c.key);
    case "faction": return p.faction===c.key;
    case "race": return p.race===c.key;
  }
  return false;
}
function condLabel(raw){
  const c=typeof raw==="string"?parseCond(raw):raw;
  if(c.error) return `Unreadable condition "${c.raw}"`;
  switch(c.kind){
    case "npc": return `Trust with this NPC: ${c.min}`;
    case "level": return `Level ${c.min}`;
    case "org": return `${c.key} reputation: ${c.min}`;
    case "region": return `Standing in ${c.key}: ${c.min}`;
    case "prof": return `${c.key} ${c.min}`;
    case "lang": return `Speaks or reads ${c.key}`;
    case "quest": return `Quest state ${c.key}`;
    case "item": return `Has ${c.key}`;
    case "faction": return `Faction ${c.key}`;
    case "race": return `Race ${c.key}`;
  }
  return c.raw;
}

/* ---------- Knowledge resolution ---------- */
function npcKnows(npc,e){
  if(!npc||!e) return null;
  if((npc.personal||[]).includes(e.id)) return {via:"personal", label:"Personal knowledge"};
  const persp=e.perspective||"neutral";
  for(const f of (npc.knows||[])){
    if((DORD[e.depth]??0) > (DORD[f.max_depth||"C"]??0)) continue;
    if(f.domains?.length && !overlap(f.domains,e.domains)) continue;
    if(f.concepts?.length && !overlap(f.concepts,e.concepts)) continue;
    if(f.spheres?.length && !overlap(f.spheres,e.spheres)) continue;
    if(f.types?.length && !f.types.includes(e.type)) continue;
    if(f.scope && !scopeRelated(e.scope,f.scope)) continue;
    if(persp!=="neutral"){ const ps=f.perspectives?.length?f.perspectives:[npc.perspective||"neutral"]; if(!ps.includes(persp)) continue; }
    return {via:"filter", label:f.label||"Filter"};
  }
  return null;
}
function anyCond(conds,p,npc){ return conds.some(c=>condMet(parseCond(c),p,npc)); }
function evaluate(npc,p,e){
  const kn=npcKnows(npc,e);
  if(!kn) return {status:"unknown"};
  const known=p.known||[];
  if(known.includes(e.id)) return {status:"known",kn,why:[]};
  if(npc.language && !(p.languages||[]).includes(npc.language)) return {status:"refused",kn,why:[`Speaks ${npc.language}, which this character doesn't`]};
  if(e.depth!=="C"){
    const rf=npc.refuse||[], why=[];
    if(rf.includes("outlaw") && p.outlaw) why.push("Won't talk past common knowledge to Outlaws");
    if(rf.includes("infamy") && Number(p.infamy||0)>0) why.push("Won't talk past common knowledge to anyone with Infamy");
    if(rf.includes("pirate") && p.faction==="pirates") why.push("Won't talk past common knowledge to pirates");
    if(rf.includes("enemy-faction") && npc.faction && npc.faction!=="neutral" && p.faction && p.faction!==npc.faction) why.push("Won't talk past common knowledge to the enemy faction");
    if(why.length) return {status:"refused",kn,why};
  }
  const missing=[];
  for(const id of (e.requires||[])) if(!known.includes(id)) missing.push(`Knows "${titleOf(id)}"`);
  if((e.requires_any||[]).length && !e.requires_any.some(id=>known.includes(id))) missing.push(`Knows one of: ${e.requires_any.map(titleOf).join(", ")}`);
  for(const c of (e.conditions||[])){ const pc=parseCond(c); if(!condMet(pc,p,npc)) missing.push(condLabel(pc)); }
  const trust=[];
  const gate=((npc.gates||{})[e.depth])||[];
  if(gate.length && !anyCond(gate,p,npc)) trust.push(`${DEPTH_INFO[e.depth].name} from this NPC needs any of: ${gate.map(condLabel).join(" · ")}`);
  if((e.gate||[]).length && !anyCond(e.gate,p,npc)) trust.push(`This entry also needs any of: ${e.gate.map(condLabel).join(" · ")}`);
  if(missing.length) return {status:"req",kn,why:missing.concat(trust)};
  if(trust.length) return {status:"trust",kn,why:trust};
  return {status:"tell",kn,why:[]};
}
function simulate(npc,p,topic){
  const g={tell:[],trust:[],req:[],refused:[],known:[]};
  if(!npc||!p) return g;
  for(const e of S.entries.values()){
    if(topic){ const [k,v]=topic.split(":"); if(k==="d" && !(e.domains||[]).includes(v)) continue; if(k==="c" && !(e.concepts||[]).includes(v)) continue; }
    const r=evaluate(npc,p,e);
    if(r.status==="unknown") continue;
    g[r.status].push({e,r});
  }
  for(const k in g) g[k].sort((a,b)=>byDepthTitle(a.e,b.e));
  return g;
}

/* ---------- Checks ---------- */
function checkAll(){
  const issues=[]; const ids=new Set(S.entries.keys());
  const add=(sev,msg,target)=>issues.push({sev,msg,target});
  for(const e of S.entries.values()){
    const tgt={kind:"entry",id:e.id};
    if(!e.title) add("warn",`"${e.id}" has no title`,tgt);
    if(!e.text) add("warn",`"${e.title||e.id}" has no player-facing text`,tgt);
    for(const f of ["requires","requires_any","next","related","contradicts"]) for(const r of (e[f]||[])) if(!ids.has(r)) add("error",`"${e.title||e.id}" ${f.replace("_"," ")} a missing entry: ${r}`,tgt);
    for(const n of (e.next||[])){ const ne=S.entries.get(n); if(ne && DORD[ne.depth]<DORD[e.depth]) add("warn",`"${e.title||e.id}" leads to a shallower step: ${ne.title||n} (${ne.depth})`,tgt); }
    for(const c of (e.conditions||[]).concat(e.gate||[])) if(parseCond(c).error) add("error",`"${e.title||e.id}" has an unreadable condition: ${c}`,tgt);
    const tellers=[...S.npcs.values()].filter(n=>npcKnows(n,e));
    const other=(e.sources||[]).filter(s=>s!=="dialogue");
    if(!tellers.length && !other.length) add("warn",`Nobody can tell "${e.title||e.id}", and it has no other source`,tgt);
    if(e.depth==="L") for(const n of tellers){ if(npcKnows(n,e).via==="filter") add("warn",`Lost entry "${e.title||e.id}" is told by ${n.name||n.id} through a filter; Lost should come only from objects, places or personal knowledge`,{kind:"npc",id:n.id}); }
    if(e.perspective!=="neutral" && e.reliability==="true" && e.depth==="D") add("warn",`"${e.title||e.id}" is a faction or faith version marked fully true`,tgt);
  }
  // cycles in requires
  const state=new Map();
  const visit=(id,path)=>{ if(state.get(id)===1){ add("error",`Requirement loop: ${path.concat(id).map(titleOf).join(" → ")}`,{kind:"entry",id}); return; } if(state.get(id)===2) return; state.set(id,1); const e=S.entries.get(id); for(const r of (e?.requires||[])) if(S.entries.has(r)) visit(r,path.concat(id)); state.set(id,2); };
  for(const id of ids) visit(id,[]);
  for(const n of S.npcs.values()){
    const tgt={kind:"npc",id:n.id};
    for(const id of (n.personal||[])) if(!ids.has(id)) add("error",`${n.name||n.id} has missing personal knowledge: ${id}`,tgt);
    (n.knows||[]).forEach((f,i)=>{ const hits=[...S.entries.values()].filter(e=>npcKnows({...n,personal:[],knows:[f]},e)).length; if(!hits) add("warn",`${n.name||n.id}: filter "${f.label||i+1}" matches no entries`,tgt); });
    for(const [d,conds] of Object.entries(n.gates||{})) for(const c of conds) if(parseCond(c).error) add("error",`${n.name||n.id} has an unreadable ${d} gate: ${c}`,tgt);
  }
  return issues.sort((a,b)=>(a.sev==="error"?0:1)-(b.sev==="error"?0:1));
}

/* ---------- Storage ---------- */
const LOCAL_KEY="runic-knowledge-workbench-v1";
const store = {
  db:null, confirmed:{}, pending:new Map(),
  async start(){
    let db=null;
    try{ db = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("db") : null; }catch(_){ db=null; }
    if(!db){ this.useLocal(); return; }
    this.db=db; S.mode="db"; renderSide();
    const timer=setTimeout(()=>{ if(Object.keys(this.confirmed).length<3){ S.note="Saved knowledge can't be reached yet. What you see may be out of date."; renderSide(); } },10000);
    const onErr=(e)=>{ S.note = e && e.code==="revoked" ? "This view can no longer read the saved knowledge." : "The saved knowledge stopped updating. Reload the page to reconnect."; renderSide(); };
    const sub=(coll)=> db.collection(coll).onSnapshot(snap=>{
        const m=new Map(); for(const d of snap.docs){ const v=d.data(); if(v) m.set(d.id, coll==="entries" ? {...cleanEntry({...v,id:d.id}), updated:v.updated} : {...v,id:d.id}); }
        S[coll]=m;
        if(!snap.metadata.fromCache){ this.confirmed[coll]=true; if(Object.keys(this.confirmed).length>=3){ clearTimeout(timer); S.note=""; } }
        onData();
      }, onErr);
    sub("entries"); sub("npcs"); sub("players");
    db.doc("config/taxonomy").onSnapshot(d=>{ if(d.exists){ S.tax=mergeTax(d.data()); } onData(); }, onErr);
  },
  useLocal(){
    S.mode="local";
    try{ const raw=localStorage.getItem(LOCAL_KEY); if(raw){ const o=JSON.parse(raw); S.entries=new Map((o.entries||[]).map(e=>[e.id,cleanEntry(e)])); S.npcs=new Map((o.npcs||[]).map(e=>[e.id,e])); S.players=new Map((o.players||[]).map(e=>[e.id,e])); if(o.taxonomy) S.tax=mergeTax(o.taxonomy); } }catch(_){}
    onData();
  },
  saveLocal(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(exportData())); }catch(_){ S.note="This browser won't keep changes; export them before you leave."; renderSide(); } },
  queued(path,fn){ const prev=this.pending.get(path)||Promise.resolve(); const next=prev.then(fn,fn); this.pending.set(path,next.catch(()=>{})); return next; },
  async put(coll,id,data){
    S[coll].set(id,{...data,id});
    if(this.db){
      try{ await this.queued(`${coll}/${id}`,()=>this.db.collection(coll).doc(id).set({...data,id})); }
      catch(e){ this.fail(e); throw e; }
    } else this.saveLocal();
    onData();
  },
  async remove(coll,id){
    S[coll].delete(id);
    if(this.db){ try{ await this.queued(`${coll}/${id}`,()=>this.db.collection(coll).doc(id).delete()); }catch(e){ this.fail(e); throw e; } }
    else this.saveLocal();
    onData();
  },
  async putTax(tax){
    S.tax=mergeTax(tax);
    if(this.db){ try{ await this.queued("config/taxonomy",()=>this.db.doc("config/taxonomy").set(tax)); }catch(e){ this.fail(e); throw e; } }
    else this.saveLocal();
    onData();
  },
  fail(e){
    if(e && e.code==="invalid_argument"){ S.mode="readonly"; S.note="You can read this knowledge but not change it here."; }
    else if(e && e.code==="quota_exceeded"){ toast("The knowledge store is full. Delete entries you no longer need, then try again."); }
    else toast("That change didn't save. Try again in a moment.");
    renderSide();
  }
};
function mergeTax(d){ const t={...clone(DEFAULT_TAX),...(d||{})}; t.tiers={...DEFAULT_TAX.tiers,...((d||{}).tiers||{})}; t.sectionMap={...DEFAULT_TAX.sectionMap,...((d||{}).sectionMap||{})}; return t; }
function exportData(){ return {taxonomy:S.tax, entries:[...S.entries.values()], npcs:[...S.npcs.values()], players:[...S.players.values()]}; }

function renderNav(){

}

  renderNav();

}
function readChips(root,field){ const g=root.querySelector(`.chips[data-field="${field}"]`); return g?[...g.querySelectorAll(".chip.on")].map(b=>b.dataset.val):[]; }
function opts(vals,sel,blank){ return (blank!==undefined?`<option value="">${esc(blank)}</option>`:"")+vals.map(v=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(v)}</option>`).join(""); }
function fld(label,inner,{full=false,id=""}={}){ return `<div class="fld ${full?"full":""}">${id?`<label for="${id}">${esc(label)}</label>`:`<span class="lbl">${esc(label)}</span>`}${inner}</div>`; }

function filteredEntries(){
  const f=S.ui.f, q=f.q.trim().toLowerCase();
  return [...S.entries.values()].filter(e=>{
    if(q && !`${e.id} ${e.title} ${e.text}`.toLowerCase().includes(q)) return false;
    if(f.depth.length && !f.depth.includes(e.depth)) return false;
    if(f.domain && !(e.domains||[]).includes(f.domain)) return false;
    if(f.concept && !(e.concepts||[]).includes(f.concept)) return false;
    if(f.sphere && !(e.spheres||[]).includes(f.sphere)) return false;
    if(f.type && e.type!==f.type) return false;
    if(f.status && e.status!==f.status) return false;
    return true;
  }).sort(byDepthTitle);
}

/* ---------- Notes to entries ---------- */
function sectionDepth(txt){
  const t=String(txt).toLowerCase();
  for(const d of DEPTHS){ for(const s of (S.tax.sectionMap[d]||[])){ const re=new RegExp(`(^|[^a-z])${s.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}([^a-z]|$)`); if(re.test(t)) return d; } }
  return null;
}
function normDepth(v){
  if(!v) return null; const s=String(v).trim();
  if(DEPTHS.includes(s.toUpperCase())) return s.toUpperCase();
  for(const d of DEPTHS) if(DEPTH_INFO[d].name.toLowerCase()===s.toLowerCase()) return d;
  return sectionDepth(s);
}
function parseFrontmatter(text){
  const m=text.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(\r?\n|$)/);
  if(!m) return {data:{},body:text};
  const data={}; let last=null;
  const unq=s=>s.trim().replace(/^["']|["']$/g,"");
  for(const raw of m[1].split(/\r?\n/)){
    if(!raw.trim()||raw.trim().startsWith("#")) continue;
    const li=raw.match(/^\s*-\s+(.*)$/);
    if(li && last){ if(!Array.isArray(data[last])) data[last]=[]; data[last].push(unq(li[1])); continue; }
    const kv=raw.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
    if(kv){ last=kv[1].toLowerCase(); const v=kv[2].trim();
      if(v==="") data[last]=[]; else if(/^\[.*\]$/.test(v)) data[last]=v.slice(1,-1).split(",").map(unq).filter(Boolean); else if(v==="true"||v==="false") data[last]=(v==="true"); else data[last]=unq(v); }
  }
  return {data,body:text.slice(m[0].length)};
}
function parseNote(text){
  const {data:fm,body}=parseFrontmatter(text);
  const out=[]; const stack=[]; let cur=null; let h1="";
  const curDepth=()=>{ for(let i=stack.length-1;i>=0;i--) if(stack[i].depth) return stack[i].depth; return null; };
  const finish=()=>{
    if(!cur) return;
    const P=cur.props;
    const pick=(k)=> P[k]!==undefined ? P[k] : fm[k];
    const e={
      title:cur.title, id:P.id||"", text:cur.body.join("\n").replace(/\n{3,}/g,"\n\n").trim(),
      depth: normDepth(P.depth) || normDepth(cur.pipe) || cur.depth || normDepth(fm.depth) || "C",
      type:pick("type")||"principle", subtype:pick("subtype")||"",
      domains:list(pick("domains")), spheres:list(pick("spheres")), concepts:list(pick("concepts")),
      reliability:pick("reliability")||"true", perspective:pick("perspective")||"neutral", scope:pick("scope")||"world", era:pick("era")||"", status:pick("status")||"draft",
      requires:list(P.requires), requires_any:list(P.requires_any), conditions:list(P.conditions), gate:list(P.gate),
      next:list(P.next), related:list(pick("related")), contradicts:list(P.contradicts),
      about: list(pick("about")).length?list(pick("about")):(h1?[slug(h1)]:[]), unlocks:list(P.unlocks), sources:list(pick("sources")), gm:""
    };
    out.push(cleanEntry(e)); cur=null;
  };
  for(const line of body.split(/\r?\n/)){
    const co=line.match(/^>\s*\[!knowledge(?:\|([A-Za-z]+))?\][+-]?\s*(.*)$/i);
    if(cur){
      if(co){ finish(); }
      else if(/^>/.test(line)){ const c=line.replace(/^>\s?/,""); const p=c.match(/^([A-Za-z_-]+)::\s*(.*)$/); if(p) cur.props[p[1].toLowerCase()]=p[2].trim(); else cur.body.push(c); continue; }
      else finish();
    }
    if(co){ cur={pipe:co[1]||"", title:co[2].trim(), props:{}, body:[], depth:curDepth()}; continue; }
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const lvl=h[1].length, txt=h[2].trim(); if(lvl===1 && !h1) h1=txt; while(stack.length && stack[stack.length-1].level>=lvl) stack.pop(); stack.push({level:lvl, depth:lvl>1?sectionDepth(txt):null}); }
  }
  finish();
  out.forEach(e=>{ if(!e.id) e.id=slug(e.title); });
  if(fm.chain===true){ for(let i=1;i<out.length;i++){ out[i].requires=uniq([...out[i].requires,out[i-1].id]); out[i-1].next=uniq([...out[i-1].next,out[i].id]); } }
  return {entries:out, npc: typeof fm.npc==="string"?slug(fm.npc):""};
}
function entriesToNote(entries){
  let md=`# Exported knowledge\n`;
  for(const d of DEPTHS){
    const es=entries.filter(e=>e.depth===d); if(!es.length) continue;
    md+=`\n## ${DEPTH_INFO[d].name}\n`;
    for(const e of es){
      md+=`\n> [!knowledge|${d}] ${e.title||e.id}\n> id:: ${e.id}\n`;
      for(const k of ["type","domains","spheres","concepts","reliability","perspective","scope","era","status","requires","requires_any","conditions","gate","next","related","contradicts","about","unlocks","sources"]){
        const v=e[k]; if(v===undefined||v===""||(Array.isArray(v)&&!v.length)) continue;
        if(k==="reliability"&&v==="true") continue; if(k==="perspective"&&v==="neutral") continue; if(k==="scope"&&v==="world") continue;
        md+=`> ${k}:: ${Array.isArray(v)?v.join(", "):v}\n`;
      }
      md+=(e.text||"").split("\n").map(l=>`> ${l}`).join("\n")+"\n";
    }
  }
  return md;
}

function buildPrompt(note){
  const existing=[...S.entries.values()].slice(0,250).map(e=>`${e.id} | ${e.depth} | ${e.title}`).join("\n");
  return `You segment a game designer's campaign notes (written like a tabletop RPG campaign) into knowledge entries for an MMORPG's knowledge system. Work only from the note: never invent facts. Each entry answers one question a player could ask an NPC. GM advice, design notes and anything a player could never learn are not knowledge.

Return ONLY a JSON object, no prose, shaped like:
{"entries":[...], "marked_note":"the same note, unchanged except that each knowledge piece is rewritten as a callout in the format below"}

Each entry has: id (kebab-case; reuse an existing id below only for the same knowledge), title (short), text (what the player learns, 1-3 sentences, in-world, neutral voice), type, domains[], spheres[], concepts[], depth, reliability, perspective, scope (a path starting with "world"), era (string, may be empty), status ("draft"), requires[] (ids the player must know first), next[] (deeper follow-ups), contradicts[], about[] (ids of people, places or things), gate[] (empty unless the note says the knowledge is kept secret; then ["npc>=Confidant"]).

Depths: C Common = anyone in scope knows it. D Doctrine = what a group believes and tells openly; may be biased, so set perspective and reliability. E Expertise = what specialists know to be true by study or craft. H Hidden = deliberately kept by a few. L Lost = nobody alive knows; only ruins, inscriptions or objects. Headings in the note may name the depth.

Callout format for marked_note:
> [!knowledge|H] Title
> id:: some-id
> requires:: other-id
> The text the player learns.

Allowed values. types: ${S.tax.types.join(", ")}. domains: ${S.tax.domains.join(", ")}. spheres: ${S.tax.spheres.join(", ")}. concepts: ${S.tax.concepts.join(", ")}. reliability: ${S.tax.reliability.join(", ")}. perspectives: ${S.tax.perspectives.join(", ")}.

Existing entries (id | depth | title):
${existing||"(none)"}

Note:
<<<
${note}
>>>`;
}
function extractJson(text){ const s=String(text||""); const a=s.indexOf("{"), b=s.lastIndexOf("}"); if(a<0||b<a) throw new Error("no json"); return JSON.parse(s.slice(a,b+1)); }

function yq(s){ s=String(s); return (/^[A-Za-z0-9][A-Za-z0-9 _./+-]*$/.test(s) && !/^(true|false|null|yes|no|on|off)$/i.test(s)) ? s : JSON.stringify(s); }
function toYaml(obj){
  let out="";
  for(const k of ENTRY_ORDER){ const v=obj[k]; if(v===undefined||v===null||v===""||(Array.isArray(v)&&!v.length)) continue;
    out += Array.isArray(v) ? `${k}: [${v.map(yq).join(", ")}]\n` : `${k}: ${yq(v)}\n`; }
  return out;
}

  try{ const dl=await window.claude.use("downloads"); if(!dl){ toast("Downloads aren't available in this view. Use Copy."); return; } await dl.save({filename,data}); }

    case "save-player": await savePlayer(); break;
    case "del-player": if(S.ui.delArm!=="p:"+S.ui.simPlayer){ S.ui.delArm="p:"+S.ui.simPlayer; t.textContent="Click again to delete"; } else { const old=S.ui.simPlayer; S.ui.delArm=null; try{ await store.remove("players",old); }catch(_){ return; } S.ui.simPlayer=[...S.players.keys()][0]||""; renderSimControls(); renderSimResults(); renderPlayerForm(); } break;
    case "extract": { S.ui.noteText=$("#n-text").value; const r=parseNote(S.ui.noteText); S.ui.extracted=r.entries; S.ui.extractedNpc=r.npc; S.ui.marked=""; S.ui.aiError=r.entries.length?"":"No knowledge callouts found. Mark pieces with > [!knowledge] Title, or ask Claude to suggest them."; renderNotesOut(); break; }
    case "suggest": await suggest(); break;
    case "example-note": S.ui.noteText=EXAMPLE_NOTE; $("#n-text").value=EXAMPLE_NOTE; break;
    case "add-extracted": await addExtracted(); break;
    case "copy-marked": await copyText(S.ui.marked,$("#marked-out")); break;
    case "save-tax": await saveTax(); break;
    case "export": openExport(); break;
    case "import": openImport(); break;
    case "do-import": await doImport(); break;
    case "close-modal": closeModal(); break;
    case "copy-export": await copyText($("#x-out").value,$("#x-out")); break;
    case "download-export": { const k=$("#x-kind").value; await offerDownload({json:"runic-knowledge.json",yaml:"runic-knowledge.yaml",note:"runic-knowledge.md"}[k], S._exports[k]); break; }
  }
});
document.addEventListener("input",(ev)=>{
  const t=ev.target;
  if(t.id==="f-q"){ S.ui.f.q=t.value; renderLibList(); }
  else if(t.id==="n-text"){ S.ui.noteText=t.value; }
  /* Once someone starts typing, live updates stop redrawing that editor. */
  else if(t.closest && t.closest("#lib-editor") && !S.ui.entryDraft){ S.ui.entryDraft=collectEntry(); }
  else if(t.closest && t.closest("#npc-editor") && !S.ui.npcDraft){ S.ui.npcDraft=collectNpc(); }
  else if(t.closest && t.closest("#sim-player-form") && !S.ui.playerDraft){ S.ui.playerDraft={...collectPlayer(),_orig:S.ui.simPlayer}; }
});
document.addEventListener("change",(ev)=>{
  const t=ev.target;
  const map={"f-domain":"domain","f-concept":"concept","f-sphere":"sphere","f-type":"type","f-status":"status"};
  if(map[t.id]){ S.ui.f[map[t.id]]=t.value; renderLibList(); return; }
  if(t.id==="sim-npc"){ S.ui.simNpc=t.value; renderSimResults(); return; }
  if(t.id==="sim-player-sel"){ S.ui.simPlayer=t.value; S.ui.playerDraft=null; renderSimResults(); renderPlayerForm(); return; }
  if(t.id==="sim-topic"){ S.ui.simTopic=t.value; renderSimResults(); return; }
  if(t.id==="x-kind"){ $("#x-out").value=S._exports[t.value]; return; }
  if(t.dataset && t.dataset.xi!==undefined){ S.ui.extracted[Number(t.dataset.xi)]._skip=!t.checked; return; }
  if(t.closest && t.closest("#lib-editor") && !S.ui.entryDraft) S.ui.entryDraft=collectEntry();
  if(t.closest && t.closest("#npc-editor") && !S.ui.npcDraft) S.ui.npcDraft=collectNpc();
  if(t.closest && t.closest("#sim-player-form") && !S.ui.playerDraft) S.ui.playerDraft={...collectPlayer(),_orig:S.ui.simPlayer};
});
document.addEventListener("keydown",(ev)=>{ if(ev.key==="Escape" && !$("#modal").hidden) closeModal(); });
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#",""); if(h && h!==S.ui.tab) setTab(h); });

/* ---------- Boot ---------- */
(async function boot(){
  const h=location.hash.replace("#","");
  setTab(TABS.some(([k])=>k===h)?h:"library");
  renderSide();
  store.start();
  try{ const smp=(window.claude && typeof window.claude.use==="function") ? await window.claude.use("sample") : null; S.sample=smp||null; }catch(_){ S.sample=null; }
  if(S.ui.tab==="notes"){ const b=$("#btn-suggest"), n=$("#suggest-note"); if(b) b.hidden=!S.sample; if(n) n.hidden=!!S.sample; }
})();
</script>
<script>
/* RunicDocs embed helper, added by tools/add_visualization.py and tools/build_slice_map.py.
   Inside a RunicDocs note the page sits in an iframe on the same site, so it can follow the site's
   light/dark toggle (Quartz keeps it in the saved-theme attribute). Opened on its own, or from another
   origin such as Obsidian, the page keeps the system theme. */
(function () {
  try {
    if (window.parent === window) return;
    var site = window.parent.document.documentElement;
    var apply = function () {
      var t = site.getAttribute("saved-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    };
    apply();
    new MutationObserver(apply).observe(site, { attributes: true, attributeFilter: ["saved-theme"] });
  } catch (e) {}
})();
</script>
