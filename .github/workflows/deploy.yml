name: Deploy RunicDocs to GitHub Pages

# Builds the vault in content/ with Quartz and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  QUARTZ_VERSION: v5.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Quartz ${{ env.QUARTZ_VERSION }}
        run: git clone --depth 1 --branch "$QUARTZ_VERSION" https://github.com/jackyzha0/quartz.git .quartz

      # Quartz 5.0.0 doesn't tell its plugins that the site lives under /RunicDocs/, so the graph,
      # explorer and search look for their data and links at the domain root. This applies the fix
      # from Quartz's main branch (data-basepath on <body>); quartz.lock.json pins the plugins that read it.
      - name: Patch Quartz for a subpath site
        run: git -C .quartz apply ../quartz-patches/body-basepath.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .quartz/package-lock.json

      # Installing Quartz's plugins takes most of a cold build; keep them between runs.
      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/.quartz/plugins
          key: quartz-plugins-${{ env.QUARTZ_VERSION }}-${{ hashFiles('quartz.config.yaml', 'quartz.lock.json') }}

      # The slice map is built from the Architecture, so the site never shows a stale one.
      - name: Build the slice map
        run: python3 tools/build_slice_map.py

      - name: Add RunicDocs content and configuration
        run: |
          rm -rf .quartz/content
          cp -r content .quartz/content
          cp quartz.config.yaml .quartz/quartz.config.yaml
          cp quartz.lock.json .quartz/quartz.lock.json
          cp quartz-styles/custom.scss .quartz/quartz/styles/custom.scss
          rm -rf .quartz/quartz-plugins
          cp -r quartz-plugins .quartz/quartz-plugins

      - name: Install Quartz
        working-directory: .quartz
        run: npm ci

      - name: Restore Quartz plugins
        working-directory: .quartz
        run: npx quartz plugin restore

      - name: Build site
        working-directory: .quartz
        run: npx quartz build

      - name: Check the built site
        run: |
          pip install --quiet playwright
          python3 tools/check_site.py .quartz/public RunicDocs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
